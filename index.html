<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Compensation Suite</title>

<style>

:root{
    --bg:#0b1120;
    --card:#111827;
    --accent:#eab308;
    --success:#10b981;
    --border:rgba(255,255,255,.08);
    --text:#f8fafc;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#0b1120;
    color:white;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:var(--card);
    border-radius:20px;
    padding:20px;
    border:1px solid var(--border);
}

.kpi{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:10px;
    border:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #333;
    text-align:left;
}

.success{
    color:var(--success);
}

.content{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

@media(max-width:900px){
    .content{
        grid-template-columns:1fr;
    }
}

</style>
</head>
<body>

<h1>💰 SeShat Compensation Suite</h1>

<div class="grid">

<div class="card">
<div>Estimated Gross</div>
<div class="kpi" id="grossPay">$0.00</div>
</div>

<div class="card">
<div>Estimated Net</div>
<div class="kpi success" id="netPay">$0.00</div>
</div>

<div class="card">
<div>Mileage</div>
<div class="kpi" id="mileagePay">$0.00</div>
</div>

<div class="card">
<div>Tax Rate</div>
<div class="kpi" id="taxRateDisplay">24%</div>
</div>

</div>

<div class="content">

<div class="card">

<h2>Payroll Calculator</h2>
<br>

<label>Regular Hours</label>
<input id="regularHours" type="number" value="72">

<label>OT Hours</label>
<input id="otHours" type="number" value="6">

<label>Double Time Hours</label>
<input id="doubleTimeHours" type="number" value="0">

<label>Call In Hours</label>
<input id="callInHours" type="number" value="4">

<label>Availability Units</label>
<input id="availabilityUnits" type="number" value="2">

<label>Kilometers Driven</label>
<input id="kilometers" type="number" value="735">

</div>

<div class="card">

<h2>Pay Summary</h2>
<br>

<div>Estimated Deposit</div>
<div class="kpi success" id="estimatedDeposit">
$0.00
</div>

<br>

<button onclick="savePayPeriod()">
Save Pay Period
</button>

<br><br>

<button onclick="exportHistory()">
Export CSV
</button>

</div>

</div>

<br>

<div class="card">

<h2>Pay History</h2>
<br>

<table>

<thead>
<tr>
<th>Date</th>
<th>Gross</th>
<th>Net</th>
<th>Mileage</th>
<th></th>
</tr>
</thead>

<tbody id="historyBody">

</tbody>

</table>

</div>

<script>

let settings = {
    regularRate:27.81,
    otMultiplier:1.5,
    dtMultiplier:2,
    mileageRate:0.40,
    availabilityRate:25,
    taxRate:24
};

let payHistory =
JSON.parse(localStorage.getItem("payHistory"))
|| [];

function calculatePayroll(){

    let regular =
    Number(document.getElementById("regularHours").value)||0;

    let ot =
    Number(document.getElementById("otHours").value)||0;

    let dt =
    Number(document.getElementById("doubleTimeHours").value)||0;

    let callIn =
    Number(document.getElementById("callInHours").value)||0;

    let avail =
    Number(document.getElementById("availabilityUnits").value)||0;

    let km =
    Number(document.getElementById("kilometers").value)||0;

    let regularPay =
    regular * settings.regularRate;

    let otPay =
    ot * settings.regularRate *
    settings.otMultiplier;

    let dtPay =
    dt * settings.regularRate *
    settings.dtMultiplier;

    let callInPay =
    callIn * settings.regularRate;

    let availabilityPay =
    avail * settings.availabilityRate;

    let mileagePay =
    km * settings.mileageRate;

    let gross =
    regularPay +
    otPay +
    dtPay +
    callInPay +
    availabilityPay;

    let taxes =
    gross *
    (settings.taxRate/100);

    let net =
    gross - taxes + mileagePay;

    document.getElementById("grossPay")
    .innerText =
    "$" + gross.toFixed(2);

    document.getElementById("netPay")
    .innerText =
    "$" + net.toFixed(2);

    document.getElementById("mileagePay")
    .innerText =
    "$" + mileagePay.toFixed(2);

    document.getElementById("estimatedDeposit")
    .innerText =
    "$" + net.toFixed(2);

    return {
        gross,
        net,
        mileagePay
    };
}

function savePayPeriod(){

    let pay =
    calculatePayroll();

    payHistory.unshift({
        date:new Date().toLocaleDateString(),
        gross:pay.gross,
        net:pay.net,
        mileage:pay.mileagePay
    });

    localStorage.setItem(
        "payHistory",
        JSON.stringify(payHistory)
    );

    renderHistory();
}

function deleteRecord(index){

    payHistory.splice(index,1);

    localStorage.setItem(
        "payHistory",
        JSON.stringify(payHistory)
    );

    renderHistory();
}

function renderHistory(){

    let body =
    document.getElementById("historyBody");

    body.innerHTML = "";

    payHistory.forEach((record,index)=>{

        body.innerHTML += `
        <tr>
            <td>${record.date}</td>
            <td>$${record.gross.toFixed(2)}</td>
            <td>$${record.net.toFixed(2)}</td>
            <td>$${record.mileage.toFixed(2)}</td>
            <td>
                <button onclick="deleteRecord(${index})">
                Delete
                </button>
            </td>
        </tr>
        `;
    });

}

function exportHistory(){

    let csv =
    "Date,Gross,Net,Mileage\n";

    payHistory.forEach(item=>{

        csv +=
`${item.date},${item.gross},${item.net},${item.mileage}\n`;

    });

    let blob =
    new Blob([csv],{
        type:'text/csv'
    });

    let a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(blob);

    a.download =
    "SeShat-Pay-History.csv";

    a.click();
}

document
.querySelectorAll("input")
.forEach(input=>{

    input.addEventListener(
        "input",
        calculatePayroll
    );

});

calculatePayroll();
renderHistory();

</script>

</body>
</html>
